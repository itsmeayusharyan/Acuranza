name: Release

# Builds the release APK signed with the Acuranza release key and publishes it as a GitHub release.
# Runs when a version tag is pushed (`git tag v1.0.0 && git push origin v1.0.0`), or from the Actions tab
# (Release > Run workflow), which tags the chosen commit with v<versionName> itself.
# Needs three repository secrets: ACURANZA_KEYSTORE_BASE64 (`base64 -w0 keystore/acuranza-release.jks`),
# ACURANZA_STORE_PASSWORD and ACURANZA_KEY_PASSWORD.

on:
  push:
    tags: ["v*"]
    # A version bump on main releases it, once: versions that already have a release are skipped.
    branches: [main]
    paths: ["app/build.gradle.kts", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # The APK is published from the release-sync script directly; this CI build only runs once
  # the repo actually has the signing secrets configured, so tag pushes don't leave failed runs.
  HAS_KEYSTORE: ${{ secrets.ACURANZA_KEYSTORE_BASE64 }}

jobs:
  release:
    runs-on: ubuntu-latest
    if: env.HAS_KEYSTORE != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag matches versionName
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$TAG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $VERSION"; exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_EVENT_NAME" = "push" ] && GH_TOKEN="${{ github.token }}" gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released; nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Restore the release keystore
        if: env.SKIP != '1'
        env:
          ACURANZA_KEYSTORE_BASE64: ${{ secrets.ACURANZA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ACURANZA_KEYSTORE_BASE64" ]; then
            echo "The ACURANZA_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          mkdir -p keystore
          echo "$ACURANZA_KEYSTORE_BASE64" | base64 -d > keystore/acuranza-release.jks
      - name: Build both editions (release-signed)
        if: env.SKIP != '1'
        env:
          ACURANZA_STORE_PASSWORD: ${{ secrets.ACURANZA_STORE_PASSWORD }}
          ACURANZA_KEY_PASSWORD: ${{ secrets.ACURANZA_KEY_PASSWORD }}
        run: |
          # No build cache: a cached compile can differ from a clean one, and F-Droid rebuilds from scratch and
          # only publishes the release APK when its own build is identical.
          ./gradlew :app:assembleRelease --console=plain --no-build-cache \
            -PACURANZA_STORE_PASSWORD="$ACURANZA_STORE_PASSWORD" -PACURANZA_KEY_PASSWORD="$ACURANZA_KEY_PASSWORD"
      - name: Check signature and that the APK has no INTERNET permission
        if: env.SKIP != '1'
        env:
          # The key installed copies of Acuranza are signed with; an APK signed with anything else can't update them.
          EXPECTED_SIGNER: 02283b8d09a5a1912906e9b5d3abed25ed4445de005f57a79cea0443f0317934
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cp app/build/outputs/apk/release/app-release.apk Acuranza.apk
          cp app/build/outputs/apk/release/app-release.apk Acuranza-universal.apk
          for apk in Acuranza.apk; do
            signer=$("$BUILD_TOOLS/apksigner" verify --print-certs "$apk" | grep -m1 "SHA-256 digest" | awk '{print $NF}')
            if [ "$signer" != "$EXPECTED_SIGNER" ]; then
              echo "$apk is signed with $signer, not the Acuranza release key. Check the ACURANZA_* secrets."; exit 1
            fi
          done
          sha256sum Acuranza.apk > SHA256SUMS
          if "$BUILD_TOOLS/aapt2" dump permissions Acuranza-universal.apk | grep -q "android.permission.INTERNET"; then
            echo "Acuranza must not request INTERNET"; exit 1
          fi
      - name: Publish the GitHub release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Acuranza $VERSION"
            cat "fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt" 2>/dev/null
            echo
            echo "Signed with the Acuranza release key: installs over earlier versions and keeps your data."
            echo "Acuranza.apk is the universal release APK; it has no internet permission. Checksums: SHA256SUMS."
          } > notes.txt
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Replaces any files published earlier under this tag and makes it the latest full release.
            gh release upload "$TAG" Acuranza.apk SHA256SUMS --clobber
            gh release edit "$TAG" --title "Acuranza $VERSION" --notes-file notes.txt --prerelease=false --latest
          else
            gh release create "$TAG" Acuranza.apk SHA256SUMS --target "$GITHUB_SHA" --title "Acuranza $VERSION" --notes-file notes.txt
          fi
      - name: Remove the keystore
        if: always()
        run: rm -f keystore/acuranza-release.jks
